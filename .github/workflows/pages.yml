name: Showcase report

# Runs defect-bridge on the example results against a local stand-in for Jira and
# GitHub (npm run showcase), then publishes the Allure report to GitHub Pages.
# The job summary of each run shows the table defect-bridge writes in CI.
# One-time setup: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  showcase:
    name: Build and deploy the showcase report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run defect-bridge against the stand-in trackers
        run: npm run showcase

      - name: Generate the Allure report
        run: npm run showcase:report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/allure-report/

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
